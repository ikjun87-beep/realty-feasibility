<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화성 향남 장짐리 228-1 — 위치도 (보고서 삽입용 정적본)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
  *{box-sizing:border-box;} html,body{margin:0;height:100%;font-family:"Pretendard","Malgun Gothic",sans-serif;color:#21262d;}
  :root{--navy:#1b2738;--navy2:#2a3a55;--gold:#b3873a;--gold-d:#8f6a2b;--gold-b:#d8c191;--red:#c0392b;--amber:#c98a1a;--green:#1e8e5a;--mut:#656565;--line:#dfdfdf;}
  #wrap{position:relative;width:1500px;height:940px;overflow:hidden;}
  .leaflet-tile-pane{filter:brightness(1.1) saturate(.78) contrast(.94);}
  #map::before{content:"";position:absolute;inset:0;z-index:350;pointer-events:none;background:rgba(255,255,255,.34);}
  #map{position:absolute;inset:0;background:#eef1f5;}
  .leaflet-container{font-family:inherit;}

  .card{position:absolute;z-index:1000;background:rgba(255,255,255,.96);
    border:1px solid var(--line);border-radius:12px;}
  .title{left:20px;top:20px;padding:16px 20px 15px;max-width:400px;border-top:4px solid var(--gold);}
  .title .kick{font-size:11px;letter-spacing:3px;color:var(--gold-d);font-weight:800;}
  .title h1{font-size:21px;margin:6px 0 0;color:var(--navy);font-weight:800;letter-spacing:-0.5px;line-height:1.25;}
  .title .sub{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5;}
  .title .meta{font-size:10px;color:#8b97a6;margin-top:9px;border-top:1px solid var(--line);padding-top:8px;line-height:1.5;}

  .legend{left:20px;bottom:22px;padding:14px 18px;width:360px;}
  .legend h2{font-size:12px;margin:0 0 9px;color:var(--navy);font-weight:800;}
  .li{display:flex;align-items:flex-start;gap:9px;margin:7px 0;}
  .li .pn{flex:0 0 20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;text-align:center;line-height:20px;}
  .li .tx{font-size:11.5px;line-height:1.35;}
  .li .tx b{color:var(--navy);} .li .tx span{color:var(--gold-d);font-weight:700;}

  .pin{position:relative;}
  .pin .num{position:absolute;left:0;right:0;top:6px;text-align:center;font-weight:800;font-size:13px;color:#fff;}
  .pin.big .num{font-size:15px;top:8px;}
  .halo{width:56px;height:56px;border-radius:50%;background:rgba(192,57,43,.22);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
  .leaflet-tooltip.nm{background:rgba(255,255,255,.97);border:1px solid #c9d4e3;color:var(--navy);font-weight:700;
    font-size:12.5px;line-height:1.35;padding:4px 9px;border-radius:7px;text-align:center;box-shadow:none;}
  .leaflet-tooltip.nm b{color:#1456f0;font-size:13px;}
  .leaflet-tooltip.nm::before{border-top-color:#c9d4e3;}
  .leaflet-tooltip.nm.site{border:2px solid var(--red);}
  .leaflet-tooltip.nm.site b{color:var(--red);}
  .leaflet-tooltip.nm.site::before{border-top-color:var(--red);}
</style>
</head>
<body>
  <div id="wrap">
    <div id="map"></div>
  </div>

<script>
// ===== 지점 (Kakao 지오코딩·POI 교차검증 확정) =====
const PLACES = [
  {n:"장짐리 228-1 (본 사업)", lab:"본 사업지", sub:"1,885세대", dir:"top", color:"#c0392b", ll:[37.139655,126.911075], big:true},
  {n:"향남산업단지", lab:"향남산업단지", sub:"종사자 3.4만 · 0.2km", dir:"right", color:"#1456f0", ll:[37.13812,126.91148]},
  {n:"화성고·화성중학교", lab:"화성고·화성중", sub:"377m · 432m", dir:"left", color:"#1e8e5a", ll:[37.13887,126.90695]},
  {n:"향남읍 구도심", lab:"향남읍 구도심", sub:"상업·문화 · 1.2km", dir:"right", color:"#b3873a", ll:[37.13243,126.92034]},
  {n:"향남2지구 신도시", lab:"향남2지구", sub:"신도시 · 2.4km", dir:"bottom", color:"#2f6fb0", ll:[37.11864,126.91539]},
];

// 배경: 항공영상(Esri) + 라벨 오버레이 — 비교사례 지도(map_comps)와 톤 통일
const base = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {maxZoom:19, crossOrigin:true, attribution:'항공영상 © Esri·Maxar · 라벨 © CARTO·OpenStreetMap'});
const map = L.map('map',{zoomControl:false,attributionControl:true});
base.addTo(map);
map.createPane('labels'); map.getPane('labels').style.zIndex=450; map.getPane('labels').style.pointerEvents='none';
const labels = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_only_labels/{z}/{x}/{y}{r}.png',
        {maxZoom:19, crossOrigin:true, pane:'labels', opacity:.92});
labels.addTo(map);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);

function pinIcon(num,color,big){
  const w=big?40:31,h=big?52:41;
  const halo = big? '<div class="halo"></div>':'';
  const svg = `<svg width="${w}" height="${h}" viewBox="0 0 30 40"><path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 13 23.5 14.2 24.6a1.1 1.1 0 0 0 1.6 0C17 38.5 30 25.5 30 15 30 6.7 23.3 0 15 0z" fill="${color}" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="6.5" fill="rgba(255,255,255,.92)"/></svg>`;
  return L.divIcon({className:'',html:`<div class="pin ${big?'big':''}">${halo}${svg}<span class="num">${num}</span></div>`,
    iconSize:[w,h],iconAnchor:[w/2,h],tooltipAnchor:[0,-h+8]});
}

const lls=[];
PLACES.forEach((p,i)=>{
  L.marker(p.ll,{icon:pinIcon('',p.color,p.big)}).addTo(map)
    .bindTooltip(`<b>${p.lab}</b><br>${p.sub}`,{className:'nm'+(p.big?' site':''),direction:p.dir,permanent:true,
      offset: p.dir==='bottom'?[0,4] : p.dir==='left'?[-16,-20] : p.dir==='right'?[16,-20] : [0,-6]});
  lls.push(p.ll);
  if(p.big){ L.circle(p.ll,{radius:500,color:'#fff',weight:3.4,fill:false,opacity:.55}).addTo(map);
              L.circle(p.ll,{radius:500,color:'#c0392b',weight:1.6,dashArray:'6 5',fill:false,opacity:.95}).addTo(map); }
});

map.fitBounds(lls,{paddingTopLeft:[80,80],paddingBottomRight:[80,80],maxZoom:15});

let _d=0; const _f=()=>{ if(++_d>=2) window.__MAP_TILES_DONE=true; };
base.on('load',_f); labels.on('load',_f);
</script>
</body>
</html>
